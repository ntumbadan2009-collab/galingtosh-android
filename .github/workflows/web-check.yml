name: Galingtosh Web checks
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-check.yml']
  push:
    branches: [main]
    paths: ['web/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
