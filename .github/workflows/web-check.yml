name: Galingtosh Web checks
on:
  pull_request:
    paths: ['web/**', 'src/lib/agentActivity.ts', '.github/workflows/web-check.yml']
  push:
    branches: [main]
    paths: ['web/**', 'src/lib/agentActivity.ts']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: diff -u ../src/lib/agentActivity.ts src/agentActivity.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-native-mobile-screenshots
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
