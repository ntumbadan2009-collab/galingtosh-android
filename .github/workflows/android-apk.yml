name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://lmlwekcytivszlszmfvy.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_kmotb1BBdQ20kWuB-ryirQ_9Rqcq88U
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Render application icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
      - name: Repair incomplete Expo Android publication metadata
        run: node .github/scripts/patch-expo-publication.js
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build ARM universal release APK (bundles JavaScript)
        working-directory: android
        run: chmod +x gradlew && ./gradlew -PreactNativeArchitectures=arm64-v8a,armeabi-v7a assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: galingtosh-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
